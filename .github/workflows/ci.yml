name: CI

on:
  push:
    branches: [main, "build/**", "ticket/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # A fresh global install, as the README's quickstart does it, run from outside the repo.
      - name: install smoke test
        env:
          BUN_INSTALL: ${{ runner.temp }}/bun-global
          HAMNESS_HOME: ${{ runner.temp }}/hamness-home
          ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
        working-directory: ${{ runner.temp }}
        run: |
          bun install -g "$GITHUB_WORKSPACE"
          "$BUN_INSTALL/bin/hamness" --version
          "$BUN_INSTALL/bin/hamness" doctor
